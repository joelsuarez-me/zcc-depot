openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser authentication endpoints.
  - name: Agendas
    description: Shared customer workshop agendas.
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /voice-comparison:
    parameters:
      - $ref: "#/components/parameters/PresenterMode"
    get:
      operationId: getVoiceComparison
      summary: Internal Zendesk Contact Center versus Voice enablement guide
      responses:
        "200":
          description: Curated internal comparison from supplied enablement documents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceComparisonGuide" }
        "401": { description: Sign-in required. }
        "403": { description: Presenter mode required. }
  /use-case-shortlists:
    parameters:
      - $ref: "#/components/parameters/PresenterMode"
    get:
      operationId: listUseCaseShortlists
      summary: List customer shortlists shared by signed-in Presenters
      responses:
        "200":
          description: Shared shortlists, most recently updated first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UseCaseShortlist" }
        "401": { description: Sign-in required. }
        "403": { description: Presenter mode required. }
    post:
      operationId: createUseCaseShortlist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UseCaseShortlistInput" }
      responses:
        "201":
          description: Saved shortlist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UseCaseShortlist" }
        "400": { description: Invalid fields or scenario IDs. }
        "401": { description: Sign-in required. }
        "403": { description: Presenter mode required. }
  /use-case-shortlists/{id}:
    parameters:
      - $ref: "#/components/parameters/PresenterMode"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getUseCaseShortlist
      responses:
        "200":
          description: Saved shortlist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UseCaseShortlist" }
        "401": { description: Sign-in required. }
        "403": { description: Presenter mode required. }
        "404": { description: Shortlist not found. }
    patch:
      operationId: updateUseCaseShortlist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UseCaseShortlistUpdate" }
      responses:
        "200":
          description: Updated shortlist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UseCaseShortlist" }
        "400": { description: Invalid fields or scenario IDs. }
        "401": { description: Sign-in required. }
        "403": { description: Presenter mode required. }
        "404": { description: Shortlist not found. }
        "409": { description: Shortlist changed since it was opened. }
    delete:
      operationId: deleteUseCaseShortlist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UseCaseShortlistRemoval" }
      responses:
        "204": { description: Shortlist deleted. }
        "400": { description: Invalid revision. }
        "401": { description: Sign-in required. }
        "403": { description: Presenter mode required. }
        "404": { description: Shortlist not found. }
        "409": { description: Shortlist changed since it was opened. }
  /presenter/content:
    get:
      operationId: getPresenterContent
      summary: Authenticated presenter-only notes and preserved internal enablement
      parameters:
        - in: header
          name: X-Depot-Mode
          required: true
          schema: { type: string, enum: [presenter] }
      responses:
        "200":
          description: Server-authorized presenter content; never public-cacheable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresenterContent" }
        "401": { description: Sign-in required. }
        "403": { description: Presenter mode required. }
  /demo-research/saved:
    get:
      operationId: listResearchReports
      summary: List shared saved research reports for signed-in portal users
      responses:
        "200":
          description: Saved report summaries, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SavedResearchSummary" }
        "401":
          description: Sign-in required.
    post:
      operationId: saveResearchReport
      summary: Save a complete research snapshot without rerunning research
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedResearchInput" }
      responses:
        "201":
          description: Saved snapshot, or the original snapshot when retrying its save key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedResearchReport" }
        "400":
          description: Invalid or incomplete report.
        "401":
          description: Sign-in required.
  /demo-research/saved/{id}:
    get:
      operationId: getSavedResearchReport
      summary: Open a shared saved research report
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Complete saved report and original input context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedResearchReport" }
        "401":
          description: Sign-in required.
        "404":
          description: Report not found.
  /demo-research/saved/{id}/agenda-draft:
    get:
      operationId: getResearchAgendaDraft
      summary: Map saved research to an unsaved agenda without creating or updating records
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Editable agenda fields. Nothing has been saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgendaInput" }
        "401":
          description: Sign-in required.
        "403":
          description: Presenter mode required.
        "404":
          description: Report not found.
        "422":
          description: Report cannot fit an agenda without losing content.
  /demo-research/saved/{id}/agenda:
    post:
      operationId: convertResearchReportToAgenda
      summary: Create or reopen the editable agenda linked to a saved report
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Linked agenda, with saved research left unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agenda" }
        "401":
          description: Sign-in required.
        "404":
          description: Report not found.
  /demo-research/saved/{id}/logo:
    get:
      operationId: getSavedResearchLogo
      summary: Read a saved report's durable logo with signed-in shared access
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Company logo.
          content:
            image/png:
              schema: { type: string, format: binary }
        "401":
          description: Sign-in required.
        "404":
          description: Logo not available.
  /demo-nuggets/preferences:
    get:
      operationId: getDemoNarrationPreferences
      summary: Read only the signed-in presenter's narration preferences
      responses:
        "200":
          description: Saved preferences, or defaults for a new presenter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoNarrationPreferences"
        "401":
          description: Sign-in required.
        "403":
          description: Cross-site request rejected.
    put:
      operationId: saveDemoNarrationPreferences
      summary: Replace only the signed-in presenter's narration preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoNarrationPreferences"
      responses:
        "200":
          description: Saved preferences. Voice availability is checked against the catalog before playback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoNarrationPreferences"
        "400":
          description: Invalid preferences.
        "401":
          description: Sign-in required.
        "403":
          description: Cross-site request rejected.
  /demo-nuggets/voices:
    get:
      operationId: getDemoVoices
      summary: Get available ElevenLabs voices and prepared demo scripts
      responses:
        "200":
          description: Available voices and prepared simulation dialogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoVoiceCatalog"
        "401":
          description: Sign-in required for voice services.
        "403":
          description: Cross-site request rejected.
        "429":
          description: Voice-service rate limit.
        "503":
          description: ElevenLabs connection unavailable.
  /demo-nuggets/speech:
    post:
      operationId: createDemoSpeech
      summary: Narrate one fixed simulation line with an available ElevenLabs voice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoSpeechInput"
      responses:
        "200":
          description: Generated speech; not a real call recording.
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        "400":
          description: Invalid line or unavailable voice.
        "401":
          description: Sign-in required.
        "403":
          description: Cross-site request rejected.
        "429":
          description: Generation or concurrency limit.
        "503":
          description: ElevenLabs speech unavailable.
  /pitch-deck:
    get:
      operationId: getPitchDeck
      summary: Read the signed-in product deep-dive slide collection
      responses:
        "200":
          description: Product slides cloned from source pages 35–47.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PitchDeck"
        "401":
          description: Sign-in required.
  /pitch-deck/slides/{number}:
    get:
      operationId: getPitchDeckSlide
      parameters:
        - name: number
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 13 }
      responses:
        "200":
          description: Original slide rendered without cropping.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401":
          description: Sign-in required.
        "404":
          description: Slide unavailable.
  /pitch-deck/pdf:
    get:
      operationId: downloadPitchDeck
      responses:
        "200":
          description: The selected 13 original product slides as a PDF.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401":
          description: Sign-in required.
        "503":
          description: PDF unavailable.
  /demo-research/company:
    post:
      operationId: resolveResearchCompany
      summary: Resolve an official company website and discover its logo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchCompanyInput"
      responses:
        "200":
          description: Company profile with an optional verified website logo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchCompany"
        "400":
          description: Invalid company or public website.
        "401":
          description: Sign-in required.
        "429":
          description: Lookup limit reached.
        "502":
          description: Company lookup unavailable.
  /demo-research/logo/{id}:
    get:
      operationId: getResearchCompanyLogo
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Normalized PNG logo belonging to this session user.
          content:
            image/png:
              schema: { type: string, format: binary }
        "401":
          description: Sign-in required.
        "404":
          description: Logo expired or unavailable.
  /demo-research/report:
    post:
      operationId: generateResearchReport
      summary: Generate a current web-grounded demo report
      description: |
        Requires sign-in. Accept text/event-stream to receive data lines containing JSON events:
        status {message}, delta {text}, complete {report}, or error {message}.
        Only a complete event is exportable. application/json returns the completed report instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchReportInput"
      responses:
        "200":
          description: Completed report, or a stream ending in complete or error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchReport"
            text/event-stream:
              schema: { type: string }
        "400":
          description: Invalid context or public website.
        "401":
          description: Sign-in required.
        "429":
          description: Research limit reached or another report is running.
        "502":
          description: Live research could not be grounded.
  /pricing-guide:
    get:
      operationId: getPricingGuide
      summary: Read signed-in pricing and internal packaging guidance
      responses:
        "200":
          description: Pricing guide for signed-in users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingGuide"
        "401":
          description: Sign-in required.
  /sell-sheet:
    get:
      operationId: getSellSheet
      summary: Read the internal sales guide
      responses:
        "200":
          description: Internal guide for signed-in users only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellSheet"
        "401":
          description: Sign-in required.
  /sell-sheet/pdf:
    get:
      operationId: downloadSellSheetPdf
      summary: Download the internal source PDF
      responses:
        "200":
          description: Protected internal PDF.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Sign-in required.
        "503":
          description: Source document temporarily unavailable.
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      responses:
        "302":
          description: Redirect to the requested page after login.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the browser session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL.
  /agendas:
    get:
      tags: [Agendas]
      operationId: listAgendas
      summary: List shared customer agendas
      responses:
        "200":
          description: Shared agendas, most recently updated first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgendaListItem"
        "401":
          description: Sign-in is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags: [Agendas]
      operationId: createAgenda
      summary: Create a shared customer agenda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaInput"
      responses:
        "201":
          description: Agenda created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agenda"
        "400":
          description: Invalid agenda data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /agendas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Agendas]
      operationId: getAgenda
      summary: Get one shared customer agenda
      responses:
        "200":
          description: Agenda details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agenda"
        "401":
          description: Sign-in is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Agenda not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags: [Agendas]
      operationId: updateAgenda
      summary: Update a shared customer agenda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaUpdate"
      responses:
        "200":
          description: Agenda updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agenda"
        "400":
          description: Invalid agenda data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Agenda not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [Agendas]
      operationId: deleteAgenda
      summary: Delete a shared customer agenda
      responses:
        "204":
          description: Agenda deleted.
        "401":
          description: Sign-in is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Agenda not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: Returns an upload URL; the client uploads image bytes directly to App Storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/authorize:
    post:
      tags: [Storage]
      operationId: authorizeUploadedObject
      summary: Share an uploaded logo with signed-in portal users
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/ObjectAuthorizationInput"
      responses:
        "200":
          description: Object access policy applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectAuthorizationResult"
        "400":
          description: Invalid object path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Uploaded object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to apply object access policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve an asset from public object search paths
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public object content.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve a protected uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          description: Sign-in is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Signed-in user does not have access to the object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  parameters:
    PresenterMode:
      name: X-Depot-Mode
      in: header
      required: true
      schema: { type: string, enum: [presenter] }
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      schema:
        type: string
  schemas:
    VoiceComparisonGuide:
      type: object
      required: [title, notice, sections, sources]
      properties:
        title: { type: string }
        notice: { type: string }
        sections:
          type: array
          items: { $ref: "#/components/schemas/VoiceComparisonSection" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/VoiceComparisonSource" }
    VoiceComparisonSource:
      type: object
      required: [id, title, note]
      properties:
        id: { type: string }
        title: { type: string }
        note: { type: string }
    VoiceComparisonSection:
      type: object
      required: [id, eyebrow, title, intro, cards, rows, questions, references]
      properties:
        id: { type: string }
        eyebrow: { type: string }
        title: { type: string }
        intro: { type: string }
        cards:
          type: array
          items: { $ref: "#/components/schemas/VoiceComparisonCard" }
        rows:
          type: array
          items: { $ref: "#/components/schemas/VoiceComparisonRow" }
        questions:
          type: array
          items: { type: string }
        references:
          type: array
          items: { type: string }
    VoiceComparisonCard:
      type: object
      required: [title, body, points]
      properties:
        title: { type: string }
        body: { type: string }
        points:
          type: array
          items: { type: string }
    VoiceComparisonRow:
      type: object
      required: [topic, voice, contactCenter]
      properties:
        topic: { type: string }
        voice: { type: string }
        contactCenter: { type: string }
    UseCaseShortlistInput:
      type: object
      required: [name, customer, notes, scenarioIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        customer: { type: string, minLength: 1, maxLength: 200 }
        notes: { type: string, maxLength: 10000 }
        scenarioIds:
          type: array
          minItems: 1
          maxItems: 45
          uniqueItems: true
          items: { $ref: "#/components/schemas/PublicScenarioId" }
    UseCaseShortlistUpdate:
      allOf:
        - $ref: "#/components/schemas/UseCaseShortlistInput"
        - type: object
          required: [revision]
          properties:
            revision: { type: integer, minimum: 1 }
    UseCaseShortlistRemoval:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, minimum: 1 }
    UseCaseShortlist:
      allOf:
