openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser authentication endpoints.
  - name: Agendas
    description: Shared customer workshop agendas.
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /sell-sheet:
    get:
      operationId: getSellSheet
      summary: Read the internal sales guide
      responses:
        "200":
          description: Internal guide for signed-in users only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellSheet"
        "401":
          description: Sign-in required.
  /sell-sheet/pdf:
    get:
      operationId: downloadSellSheetPdf
      summary: Download the internal source PDF
      responses:
        "200":
          description: Protected internal PDF.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Sign-in required.
        "503":
          description: Source document temporarily unavailable.
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      responses:
        "302":
          description: Redirect to the requested page after login.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the browser session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL.
  /agendas:
    get:
      tags: [Agendas]
      operationId: listAgendas
      summary: List shared customer agendas
      responses:
        "200":
          description: Shared agendas, most recently updated first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgendaListItem"
        "401":
          description: Sign-in is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags: [Agendas]
      operationId: createAgenda
      summary: Create a shared customer agenda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaInput"
      responses:
        "201":
          description: Agenda created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agenda"
        "400":
          description: Invalid agenda data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /agendas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Agendas]
      operationId: getAgenda
      summary: Get one shared customer agenda
      responses:
        "200":
          description: Agenda details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agenda"
        "401":
          description: Sign-in is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Agenda not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags: [Agendas]
      operationId: updateAgenda
      summary: Update a shared customer agenda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaUpdate"
      responses:
        "200":
          description: Agenda updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agenda"
        "400":
          description: Invalid agenda data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Agenda not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [Agendas]
      operationId: deleteAgenda
      summary: Delete a shared customer agenda
      responses:
        "204":
          description: Agenda deleted.
        "401":
          description: Sign-in is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Agenda not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: Returns an upload URL; the client uploads image bytes directly to App Storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/authorize:
    post:
      tags: [Storage]
      operationId: authorizeUploadedObject
      summary: Share an uploaded logo with signed-in portal users
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/ObjectAuthorizationInput"
      responses:
        "200":
          description: Object access policy applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectAuthorizationResult"
        "400":
          description: Invalid object path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Uploaded object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to apply object access policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve an asset from public object search paths
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public object content.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve a protected uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          description: Sign-in is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Signed-in user does not have access to the object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      schema:
        type: string
  schemas:
    SellSheet:
      type: object
      required: [title, businessChallenge, pains, pitch, plays, preparation, pdfUrl]
      properties:
        title:
          type: string
        businessChallenge:
          type: string
        pains:
          type: array
          items:
            type: string
        pitch:
          type: array
          items:
            type: string
        plays:
          type: array
          items:
            $ref: "#/components/schemas/SellSheetPlay"
        preparation:
          type: array
          items:
            $ref: "#/components/schemas/SellSheetPreparation"
        pdfUrl:
          type: string
    SellSheetPlay:
      type: object
      required: [title, help, capabilities, metrics, stories]
      properties:
        title:
          type: string
        help:
          type: string
        capabilities:
          type: array
          items:
            type: string
        metrics:
          type: array
          items:
            type: string
        stories:
          type: array
          items:
            type: string
    SellSheetPreparation:
      type: object
      required: [title, steps, questions]
      properties:
        title:
          type: string
        steps:
          type: array
          items:
            type: string
        questions:
          type: array
          items:
            type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
          format: email
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    AgendaListItem:
      type: object
      required: [id, company, description, logoPath, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        company:
          type: string
        description:
          type: string
        logoPath:
          type: [string, "null"]
        updatedAt:
          type: string
          format: date-time
    Agenda:
      allOf:
        - $ref: "#/components/schemas/AgendaListItem"
        - type: object
          required: [currentState, conversation, problems, outcomes, createdAt]
          properties:
            currentState:
              type: string
            conversation:
              type: string
            problems:
              type: string
            outcomes:
              type: string
            createdAt:
              type: string
              format: date-time
    AgendaInput:
      type: object
      required: [company]
      properties:
        company:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 500
        currentState:
          type: string
          maxLength: 5000
        conversation:
          type: string
          maxLength: 5000
        problems:
          type: string
          maxLength: 5000
        outcomes:
          type: string
          maxLength: 5000
        logoPath:
          type: [string, "null"]
    AgendaUpdate:
      type: object
      minProperties: 1
      properties:
        company:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 500
        currentState:
          type: string
          maxLength: 5000
        conversation:
          type: string
          maxLength: 5000
        problems:
          type: string
          maxLength: 5000
        outcomes:
          type: string
          maxLength: 5000
        logoPath:
          type: [string, "null"]
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
          maximum: 8388608
        contentType:
          type: string
          minLength: 1
          enum: [image/png, image/jpeg, image/webp]
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ObjectAuthorizationInput:
      type: object
      required: [objectPath]
      properties:
        objectPath:
          type: string
          minLength: 1
    ObjectAuthorizationResult:
      type: object
      required: [objectPath]
      properties:
        objectPath:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

