      type: object
      required: [question, answer]
      properties:
        question: { type: string }
        answer: { type: string }
    PresenterRoom:
      type: object
      required: [id, title, speakerNotes, technicalPoints, discoveryQuestions, objections, progression]
      properties:
        id: { type: string }
        title: { type: string }
        speakerNotes: { type: array, items: { type: string } }
        technicalPoints: { type: array, items: { type: string } }
        discoveryQuestions: { type: array, items: { type: string } }
        objections: { type: array, items: { $ref: "#/components/schemas/PresenterObjection" } }
        progression: { type: array, items: { type: string } }
    PresenterContent:
      type: object
      required: [legacy, rooms]
      properties:
        legacy:
          type: object
          required: [roadmap, gtm, briefing, resources]
          properties:
            roadmap:
              type: object
              required: [executive, technical, internal]
              properties:
                executive: { type: array, items: { $ref: "#/components/schemas/PresenterRoadmapItem" } }
                technical: { type: array, items: { $ref: "#/components/schemas/PresenterRoadmapItem" } }
                internal: { type: array, items: { $ref: "#/components/schemas/PresenterRoadmapItem" } }
            gtm: { type: array, items: { $ref: "#/components/schemas/PresenterGtmItem" } }
            briefing: { type: array, items: { type: string } }
            resources: { type: array, items: { $ref: "#/components/schemas/PresenterResource" } }
        rooms: { type: array, items: { $ref: "#/components/schemas/PresenterRoom" } }
    DemoNarrationPreferences:
      type: object
      additionalProperties: false
      required: [voices, enabled, volume, captions]
      properties:
        voices:
          $ref: "#/components/schemas/DemoNarrationVoiceChoices"
        enabled: { type: boolean }
        volume: { type: number, minimum: 0, maximum: 1 }
        captions: { type: boolean }
    DemoNarrationVoiceChoices:
      type: object
      additionalProperties: false
      properties:
        caller: { type: string, minLength: 1, maxLength: 100, pattern: "^[a-zA-Z0-9_-]+$" }
        ai-agent: { type: string, minLength: 1, maxLength: 100, pattern: "^[a-zA-Z0-9_-]+$" }
        human-agent: { type: string, minLength: 1, maxLength: 100, pattern: "^[a-zA-Z0-9_-]+$" }
        narrator: { type: string, minLength: 1, maxLength: 100, pattern: "^[a-zA-Z0-9_-]+$" }
    DemoVoice:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        languageAccents:
          type: array
          description: Provider catalog labels and verified language/accent pairs for the current narration model. Missing values are omitted, never inferred.
          items: { $ref: "#/components/schemas/DemoVoiceLanguageAccent" }
    DemoVoiceLanguageAccent:
      type: object
      properties:
        language: { type: string }
        accent: { type: string }
    DemoNarrationLine:
      type: object
      required: [nuggetId, id, role, text, locale]
      properties:
        locale: { $ref: "#/components/schemas/DemoScriptLocale" }
        nuggetId: { $ref: "#/components/schemas/DemoNuggetId" }
        id: { type: string }
        role: { $ref: "#/components/schemas/DemoVoiceRole" }
        text: { type: string }
    DemoScriptLocale:
      type: string
      description: Language of the fixed, reviewed script, independent of provider voice catalog labels. Omitted speech locale defaults to en-US for older clients.
      enum: [en-US, es-ES, fr-FR]
    DemoNuggetId:
      type: string
      enum: [voice-copilot, voice-qa, voice-ai-agents, video-screen-sharing]
    DemoVoiceRole:
      type: string
      enum: [caller, ai-agent, human-agent, narrator]
    DemoVoiceCatalog:
      type: object
      required: [voices, lines]
      properties:
        voices:
          type: array
          items: { $ref: "#/components/schemas/DemoVoice" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/DemoNarrationLine" }
    DemoSpeechInput:
      type: object
      additionalProperties: false
      required: [nuggetId, lineId, voiceId]
      properties:
